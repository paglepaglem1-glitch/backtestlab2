<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>BacktestLab</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:#080b11;
  color:#edf2f7;
  font-family:Arial,sans-serif;
}

header{
  height:70px;
  padding:0 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid #202938;
  background:#0c1119;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo span{
  color:#35d39a;
}

#status{
  color:#35d39a;
  font-size:12px;
}

main{
  width:94%;
  max-width:1450px;
  margin:22px auto 50px;
}

.panel{
  background:#0f141d;
  border:1px solid #202938;
  border-radius:15px;
  padding:16px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

label{
  display:block;
  color:#7f8ca3;
  font-size:11px;
  font-weight:bold;
  margin-bottom:6px;
  text-transform:uppercase;
}

input,
select,
button{
  width:100%;
  height:40px;
  border-radius:8px;
  border:1px solid #263143;
  background:#090e16;
  color:#edf2f7;
  padding:0 10px;
}

button{
  cursor:pointer;
  background:#182130;
  font-weight:bold;
}

button:hover{
  background:#253247;
}

.green{
  background:#35d39a;
  color:#07100d;
}

.red{
  background:#ff5c72;
  color:#16070a;
}

.blue{
  background:#6d9cff;
  color:#07101c;
}

.yellow{
  background:#f2b84b;
  color:#111;
}

.chartWrap{
  background:#0f141d;
  border:1px solid #202938;
  border-radius:15px;
  overflow:hidden;
}

.chartTop{
  padding:15px 18px;
  border-bottom:1px solid #202938;
  display:flex;
  justify-content:space-between;
}

#price{
  font-size:20px;
  font-weight:bold;
}

canvas{
  display:block;
  width:100%;
  height:470px;
  background:#090e16;
}

.controls{
  display:flex;
  gap:8px;
  padding:12px;
  border-top:1px solid #202938;
  flex-wrap:wrap;
}

.controls button{
  width:auto;
  min-width:110px;
}

.riskGrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.stat{
  background:#0f141d;
  border:1px solid #202938;
  border-radius:13px;
  padding:15px;
}

.stat small{
  display:block;
  color:#7f8ca3;
  margin-bottom:7px;
}

.stat strong{
  font-size:18px;
}

.tradeButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:11px;
  text-align:left;
  border-bottom:1px solid #202938;
  font-size:12px;
}

th{
  color:#7f8ca3;
  font-size:10px;
}

.info{
  color:#7f8ca3;
  font-size:11px;
  margin-top:10px;
}

@media(max-width:900px){

  .grid,
  .riskGrid,
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){

  .grid,
  .riskGrid,
  .stats{
    grid-template-columns:1fr;
  }

  canvas{
    height:350px;
  }
}
</style>
</head>

<script>

/* =========================================================
   BACKTESTLAB
========================================================= */


const $ =
  id => document.getElementById(id);


/* =========================
   MARKETS
========================= */

const pairs = {

  Forex:[
    "EUR/USD",
    "GBP/USD",
    "USD/JPY",
    "AUD/USD",
    "USD/CAD",
    "USD/CHF",
    "NZD/USD"
  ],

  Metals:[
    "XAU/USD",
    "XAG/USD"
  ],

  Crypto:[
    "BTC/USD",
    "ETH/USD",
    "SOL/USD"
  ]

};


/* =========================
   API SYMBOLS
========================= */

const symbols = {

  "EUR/USD":"EURUSD",
  "GBP/USD":"GBPUSD",
  "USD/JPY":"USDJPY",
  "AUD/USD":"AUDUSD",
  "USD/CAD":"USDCAD",
  "USD/CHF":"USDCHF",
  "NZD/USD":"NZDUSD",

  "XAU/USD":"XAUUSD",
  "XAG/USD":"XAGUSD",

  "BTC/USD":"BTCUSD",
  "ETH/USD":"ETHUSD",
  "SOL/USD":"SOLUSD"

};


/* =========================
   TIMEFRAMES
========================= */

const intervals = {

  "5m":"5m",
  "15m":"15m",
  "1H":"1h",
  "4H":"4h",
  "1D":"1d"

};


/* =========================
   VARIABLES
========================= */

let candles = [];

let candleIndex = 0;

let openTrade = null;

let pendingOrder = null;

let trades = [];

let balance = 1000;

let peakBalance = 1000;

let timer = null;



/* =========================
   SET PAIRS
========================= */

function setupPairs(){

  const market =
    $("market").value;


  $("pair").innerHTML =
    pairs[market]
      .map(
        p =>
          `<option value="${p}">
            ${p}
          </option>`
      )
      .join("");


  $("chartPair").textContent =
    $("pair").value;

}


$("market").addEventListener(
  "change",
  setupPairs
);


$("pair").addEventListener(
  "change",
  ()=>{

    $("chartPair").textContent =
      $("pair").value;

    if(candles.length){

      loadHistorical();

    }

  }
);


$("timeframe").addEventListener(
  "change",
  ()=>{

    if(candles.length){

      loadHistorical();

    }

  }
);



/* =========================
   LOAD REAL DATA
========================= */

async function loadHistorical(){

  const pair =
    $("pair").value;


  const interval =
    intervals[
      $("timeframe").value
    ];


  const symbol =
    symbols[pair];


  if(!symbol){

    alert(
      "Symbol mapping nahi mila."
    );

    return;

  }


  stopPlay();


  $("status").textContent =
    "Loading historical data...";


  $("status").style.color =
    "#f2b84b";


  $("chartInfo").textContent =
    "Downloading real historical candles...";


  try{

    const url =
      `https://biquote.io/api/${symbol}/ohlc?interval=${interval}&limit=1000`;


    const response =
      await fetch(url);


    if(!response.ok){

      throw new Error(
        "Historical API request failed."
      );

    }


    const data =
      await response.json();


    if(
      !data ||
      !Array.isArray(data.bars) ||
      !data.bars.length
    ){

      throw new Error(
        "No historical candles returned."
      );

    }


    candles =
      data.bars
        .filter(
          x => !x.isOpen
        )
        .reverse()
        .map(
          x => ({

            time:
              x.openTime,

            open:
              Number(x.open),

            high:
              Number(x.high),

            low:
              Number(x.low),

            close:
              Number(x.close),

            volume:
              Number(x.volume || 0)

          })
        )
        .filter(
          x =>
            Number.isFinite(x.open) &&
            Number.isFinite(x.high) &&
            Number.isFinite(x.low) &&
            Number.isFinite(x.close)
        );


    if(!candles.length){

      throw new Error(
        "Valid candles nahi mili."
      );

    }


    candleIndex =
      Math.min(
        50,
        candles.length - 1
      );


    openTrade = null;

    pendingOrder = null;


    $("status").textContent =
      "Historical Data Loaded";


    $("status").style.color =
      "#35d39a";


    $("dataInfo").textContent =
      `${pair} • ${$("timeframe").value} • ${candles.length} historical candles`;


    $("chartInfo").textContent =
      `${pair} • ${$("timeframe").value} • Real Historical Data`;


    render();


  }

  catch(error){

    console.error(error);


    candles = [];


    $("status").textContent =
      "Data Load Error";


    $("status").style.color =
      "#ff5c72";


    $("chartInfo").textContent =
      "Historical data could not be loaded";


    $("dataInfo").textContent =
      error.message;


    drawChart();

  }

}



/* =========================
   DOWNLOAD HISTORICAL CSV
========================= */

$("downloadData").addEventListener(
  "click",
  ()=>{

    if(!candles.length){

      alert(
        "Pehle Historical Data load karo."
      );

      return;

    }


    let csv =
      "timestamp,open,high,low,close,volume\n";


    candles.forEach(
      c => {

        csv +=
          `${c.time || ""},${c.open},${c.high},${c.low},${c.close},${c.volume || 0}\n`;

      }
    );


    const blob =
      new Blob(
        [csv],
        {
          type:"text/csv"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href = url;


    const pair =
      $("pair").value
        .replace("/","");


    const tf =
      $("timeframe").value;


    a.download =
      `${pair}_${tf}_historical.csv`;


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

  }
);



/* =========================
   LOAD BUTTON
========================= */

$("loadData").addEventListener(
  "click",
  loadHistorical
);



/* =========================
   PRICE FORMAT
========================= */

function format(price){

  if(
    !Number.isFinite(price)
  ){

    return "---";

  }


  if(price < 10){

    return price.toFixed(5);

  }


  return price.toFixed(2);

}



/* =========================
   CANVAS
========================= */

function resize(){

  const canvas =
    $("chart");


  const rect =
    canvas.getBoundingClientRect();


  const dpr =
    window.devicePixelRatio || 1;


  canvas.width =
    rect.width * dpr;


  canvas.height =
    rect.height * dpr;


  const ctx =
    canvas.getContext("2d");


  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );


  drawChart();

}



/* =========================
   DRAW CHART
========================= */

function drawChart(){

  const canvas =
    $("chart");


  const ctx =
    canvas.getContext("2d");


  const width =
    canvas.clientWidth;


  const height =
    canvas.clientHeight;


  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  if(!candles.length){

    ctx.fillStyle =
      "#68758a";


    ctx.font =
      "14px Arial";


    ctx.fillText(
      "Click Load Historical Data",
      25,
      40
    );


    return;

  }


  const visible =
    candles.slice(
      Math.max(
        0,
        candleIndex - 80
      ),
      candleIndex + 1
    );


  let min =
    Math.min(
      ...visible.map(
        x => x.low
      )
    );


  let max =
    Math.max(
      ...visible.map(
        x => x.high
      )
    );


  const padding =
    (max - min) * 0.12 || 1;


  min -= padding;

  max += padding;


  const priceY =
    price =>
      height -
      (
        (price - min) /
        (max - min)
      ) *
      height;


  /* GRID */

  ctx.strokeStyle =
    "#17202d";


  for(
    let i=0;
    i<=5;
    i++
  ){

    const y =
      i * height / 5;


    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(width,y);

    ctx.stroke();


    const value =
      max -
      ((max-min)*i/5);


    ctx.fillStyle =
      "#68758a";


    ctx.font =
      "11px Arial";


    ctx.fillText(
      format(value),
      width-75,
      Math.max(12,y-4)
    );

  }


  const step =
    width /
    visible.length;


  const candleWidth =
    Math.max(
      3,
      step * .55
    );


  visible.forEach(
    (c,i)=>{

      const x =
        i * step +
        step / 2;


      const bullish =
        c.close >= c.open;


      const color =
        bullish
          ? "#35d39a"
          : "#ff5c72";


      ctx.strokeStyle =
        color;


      ctx.fillStyle =
        color;


      const yHigh =
        priceY(c.high);


      const yLow =
        priceY(c.low);


      const yOpen =
        priceY(c.open);


      const yClose =
        priceY(c.close);


      /* WICK */

      ctx.beginPath();

      ctx.moveTo(
        x,
        yHigh
      );

      ctx.lineTo(
        x,
        yLow
      );

      ctx.stroke();


      /* BODY */

      ctx.fillRect(

        x -
        candleWidth/2,

        Math.min(
          yOpen,
          yClose
        ),

        candleWidth,

        Math.max(
          1,
          Math.abs(
            yClose-yOpen
          )
        )

      );

    }
  );


  if(openTrade){

    drawLevel(
      openTrade.entry,
      "#35d39a",
      "ENTRY"
    );


    drawLevel(
      openTrade.sl,
      "#ff5c72",
      "SL"
    );


    drawLevel(
      openTrade.tp,
      "#6d9cff",
      "TP"
    );

  }


  if(pendingOrder){

    drawLevel(
      pendingOrder.entry,
      "#f2b84b",
      "LIMIT"
    );

  }


  function drawLevel(
    price,
    color,
    label
  ){

    const y =
      priceY(price);


    ctx.strokeStyle =
      color;


    ctx.setLineDash(
      [6,4]
    );


    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(width,y);

    ctx.stroke();


    ctx.setLineDash([]);


    ctx.fillStyle =
      color;


    ctx.font =
      "11px Arial";


    ctx.fillText(
      `${label} ${format(price)}`,
      8,
      Math.max(14,y-5)
    );

  }

}



/* =========================
   RISK CALCULATION
========================= */

function calculateRisk(){

  const bal =
    Number(
      $("balance").value
    ) || 0;


  const riskPercent =
    Number(
      $("risk").value
    ) || 0;


  const entry =
    Number(
      $("entry").value
    );


  const sl =
    Number(
      $("sl").value
    );


  const tp =
    Number(
      $("tp").value
    );


  const riskMoney =
    bal *
    riskPercent /
    100;


  $("riskAmount").value =
    "$" +
    riskMoney.toFixed(2);


  if(
    !entry ||
    !sl ||
    !tp
  ){

    $("slDistance").value =
      "-";

    $("tpDistance").value =
      "-";

    $("rr").value =
      "-";

    $("size").value =
      "-";

    return;

  }


  const slDistance =
    Math.abs(
      entry-sl
    );


  const tpDistance =
    Math.abs(
      tp-entry
    );


  if(slDistance<=0){

    $("rr").value =
      "-";

    $("size").value =
      "-";

    return;

  }


  const rr =
    tpDistance /
    slDistance;


  $("slDistance").value =
    format(slDistance);


  $("tpDistance").value =
    format(tpDistance);


  $("rr").value =
    "1:" +
    rr.toFixed(2);


  const pair =
    $("pair").value;


  let size;


  if(
    [
      "EUR/USD",
      "GBP/USD",
      "AUD/USD",
      "USD/CAD",
      "USD/CHF",
      "NZD/USD"
    ].includes(pair)
  ){

    size =
      riskMoney /
      (
        slDistance *
        100000
      );

  }

  else{

    size =
      riskMoney /
      slDistance;

  }


  $("size").value =
    Math.max(
      0,
      size
    ).toFixed(4);

}



/* =========================
   PLACE ORDER
========================= */

function placeOrder(side){

  if(!candles.length){

    alert(
      "Pehle historical data load karo."
    );

    return;

  }


  if(openTrade){

    alert(
      "Current trade already open hai."
    );

    return;

  }


  if(pendingOrder){

    alert(
      "Pending order already hai."
    );

    return;

  }


  const current =
    candles[candleIndex].close;


  let entry;


  if(
    $("orderType").value ===
    "MARKET"
  ){

    entry =
      current;


    $("entry").value =
      format(entry);

  }

  else{

    entry =
      Number(
        $("entry").value
      );


    if(!entry){

      alert(
        "Limit entry price enter karo."
      );

      return;

    }

  }


  const sl =
    Number(
      $("sl").value
    );


  const tp =
    Number(
      $("tp").value
    );


  if(!sl || !tp){

    alert(
      "SL aur TP set karo."
    );

    return;

  }


  if(
    side === "BUY" &&
    !(sl < entry && tp > entry)
  ){

    alert(
      "BUY: SL < Entry < TP hona chahiye."
    );

    return;

  }


  if(
    side === "SELL" &&
    !(tp < entry && sl > entry)
  ){

    alert(
      "SELL: TP < Entry < SL hona chahiye."
    );

    return;

  }


  calculateRisk();


  const size =
    Number(
      $("size").value
    );


  if(!size || size<=0){

    alert(
      "Position size calculate nahi hui."
    );

    return;

  }


  const trade = {

    type:
      $("orderType").value,

    side,

    entry,

    sl,

    tp,

    size

  };


  if(
    $("orderType").value ===
    "MARKET"
  ){

    openTrade =
      trade;

  }

  else{

    pendingOrder =
      trade;

  }


  updateStats();

  drawChart();

}



/* =========================
   NEXT CANDLE
========================= */

function nextCandle(){

  if(!candles.length)
    return;


  if(
    candleIndex >=
    candles.length-1
  ){

    stopPlay();

    return;

  }


  candleIndex++;


  checkPending();

  checkTrade();


  render();

}



/* =========================
   PREVIOUS
========================= */

function previousCandle(){

  if(
    candleIndex<=0
  )
    return;


  candleIndex--;


  render();

}



/* =========================
   PENDING
========================= */

function checkPending(){

  if(!pendingOrder)
    return;


  const c =
    candles[candleIndex];


  if(
    pendingOrder.side === "BUY" &&
    c.low <= pendingOrder.entry
  ){

    openTrade =
      pendingOrder;

    pendingOrder =
      null;

    return;

  }


  if(
    pendingOrder.side === "SELL" &&
    c.high >= pendingOrder.entry
  ){

    openTrade =
      pendingOrder;

    pendingOrder =
      null;

  }

}



/* =========================
   SL TP
========================= */

function checkTrade(){

  if(!openTrade)
    return;


  const c =
    candles[candleIndex];


  let exit = null;

  let reason = "";


  if(
    openTrade.side === "BUY"
  ){

    if(
      c.low <=
      openTrade.sl
    ){

      exit =
        openTrade.sl;

      reason =
        "SL";

    }

    else if(
      c.high >=
      openTrade.tp
    ){

      exit =
        openTrade.tp;

      reason =
        "TP";

    }

  }

  else{

    if(
      c.high >=
      openTrade.sl
    ){

      exit =
        openTrade.sl;

      reason =
        "SL";

    }

    else if(
      c.low <=
      openTrade.tp
    ){

      exit =
        openTrade.tp;

      reason =
        "TP";

    }

  }


  if(exit !== null){

    closeTrade(
      exit,
      reason
    );

  }

}



/* =========================
   CLOSE TRADE
========================= */

function closeTrade(
  exit,
  reason
){

  const pair =
    $("pair").value;


  let multiplier =
    1;


  if(
    [
      "EUR/USD",
      "GBP/USD",
      "AUD/USD",
      "USD/CAD",
      "USD/CHF",
      "NZD/USD"
    ].includes(pair)
  ){

    multiplier =
      100000;

  }


  const difference =
    openTrade.side === "BUY"

      ? exit -
        openTrade.entry

      : openTrade.entry -
        exit;


  const pl =
    difference *
    openTrade.size *
    multiplier;


  balance += pl;


  trades.unshift({

    type:
      openTrade.type,

    side:
      openTrade.side,

    entry:
      openTrade.entry,

    exit,

    pl,

    reason

  });


  openTrade =
    null;


  peakBalance =
    Math.max(
      peakBalance,
      balance
    );


  renderHistory();

  updateStats();

}



/* =========================
   RENDER
========================= */

function render(){

  if(!candles.length){

    drawChart();

    return;

  }


  const current =
    candles[candleIndex].close;


  $("price").textContent =
    format(current);


  $("chartPair").textContent =
    $("pair").value;


  $("chartInfo").textContent =
    `${$("pair").value} • ${$("timeframe").value} • Candle ${candleIndex+1}/${candles.length}`;


  if(
    $("orderType").value === "MARKET" &&
    !openTrade &&
    !pendingOrder
  ){

    $("entry").value =
      format(current);

  }


  calculateRisk();

  drawChart();

  updateStats();

}



/* =========================
   STATS
========================= */

function updateStats(){

  $("statBalance").textContent =
    "$" +
    balance.toFixed(2);


  const starting =
    Number(
      $("balance").value
    ) || 1000;


  const net =
    balance -
    starting;


  $("statPL").textContent =
    `${net>=0 ? "+" : ""}$${net.toFixed(2)}`;


  const wins =
    trades.filter(
      x => x.pl > 0
    ).length;


  $("statWin").textContent =
    trades.length
      ? (
          wins /
          trades.length *
          100
        ).toFixed(0) + "%"

      : "0%";


  const dd =
    peakBalance
      ? (
          (
            peakBalance -
            balance
          ) /
          peakBalance
        ) * 100

      : 0;


  $("statDD").textContent =
    dd.toFixed(2) +
    "%";


  $("statOpen").textContent =
    openTrade
      ? `${openTrade.side} @ ${format(openTrade.entry)}`
      : "None";


  $("statPending").textContent =
    pendingOrder
      ? `${pendingOrder.side} LIMIT @ ${format(pendingOrder.entry)}`
      : "None";

}



/* =========================
   HISTORY
========================= */

function renderHistory(){

  if(!trades.length){

    $("history").innerHTML =

      `
      <tr>
        <td colspan="7">
          No closed trades
        </td>
      </tr>
      `;

    return;

  }


  $("history").innerHTML =

    trades.map(
      (t,i)=>

      `
      <tr>

        <td>${i+1}</td>

        <td>${t.type}</td>

        <td>${t.side}</td>

        <td>${format(t.entry)}</td>

        <td>${format(t.exit)}</td>

        <td>
          ${t.pl>=0 ? "+" : ""}
          $${t.pl.toFixed(2)}
        </td>

        <td>${t.reason}</td>

      </tr>
      `
    ).join("");

}



/* =========================
   RESET
========================= */

$("reset").addEventListener(
  "click",
  ()=>{

    stopPlay();


    balance =
      Number(
        $("balance").value
      ) || 1000;


    peakBalance =
      balance;


    trades = [];


    openTrade = null;

    pendingOrder = null;


    candleIndex =
      candles.length
        ? Math.min(
            50,
            candles.length-1
          )
        : 0;


    renderHistory();

    render();

  }
);



/* =========================
   CLEAR
========================= */

$("clear").addEventListener(
  "click",
  ()=>{

    trades = [];


    balance =
      Number(
        $("balance").value
      ) || 1000;


    peakBalance =
      balance;


    renderHistory();

    updateStats();

  }
);



/* =========================
   PLAY
========================= */

$("play").addEventListener(
  "click",
  ()=>{

    if(timer){

      stopPlay();

      return;

    }


    if(!candles.length){

      alert(
        "Pehle Historical Data load karo."
      );

      return;

    }


    $("play").textContent =
      "⏸ Pause";


    timer =
      setInterval(
        nextCandle,
        700
      );

  }
);


function stopPlay(){

  if(timer){

    clearInterval(timer);

    timer = null;

  }


  $("play").textContent =
    "▶ Play";

}



/* =========================
   BUTTONS
========================= */

$("next").addEventListener(
  "click",
  nextCandle
);


$("prev").addEventListener(
  "click",
  previousCandle
);


$("buy").addEventListener(
  "click",
  ()=>placeOrder("BUY")
);


$("sell").addEventListener(
  "click",
  ()=>placeOrder("SELL")
);



/* =========================
   INPUTS
========================= */

[
  "balance",
  "risk",
  "entry",
  "sl",
  "tp"
].forEach(
  id => {

    $(id).addEventListener(
      "input",
      ()=>{

        calculateRisk();

        updateStats();

        drawChart();

      }
    );

  }
);



/* =========================
   ORDER TYPE
========================= */

$("orderType").addEventListener(
  "change",
  ()=>{

    if(
      candles.length &&
      $("orderType").value ===
      "MARKET"
    ){

      $("entry").value =
        format(
          candles[candleIndex].close
        );

    }


    calculateRisk();

    drawChart();

  }
);



/* =========================
   EXPORT TRADES
========================= */

$("export").addEventListener(
  "click",
  ()=>{

    if(!trades.length){

      alert(
        "Export ke liye closed trades chahiye."
      );

      return;

    }


    let csv =
      "Type,Side,Entry,Exit,P/L,Reason\n";


    trades.forEach(
      t => {

        csv +=
          `${t.type},${t.side},${t.entry},${t.exit},${t.pl},${t.reason}\n`;

      }
    );


    const blob =
      new Blob(
        [csv],
        {
          type:"text/csv"
        }
      );


    const url =
      URL.createObjectURL(blob);


    const a =
      document.createElement("a");


    a.href =
      url;


    a.download =
      "backtest-results.csv";


    document.body.appendChild(a);

    a.click();

    a.remove();


    URL.revokeObjectURL(url);

  }
);



/* =========================
   START
========================= */

setupPairs();

renderHistory();

updateStats();

window.addEventListener(
  "resize",
  resize
);

resize();


/* Automatically load EUR/USD */

loadHistorical();

</script>

</body>
</html>
